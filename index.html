
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DesignCat — Graphic Design & Creative Direction</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f6f2;
      color: #191919;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 700px;
      padding: 40px 24px;
    }
    h1 {
      font-size: clamp(48px, 10vw, 100px);
      letter-spacing: -0.07em;
      margin: 0 0 20px;
    }
    h2 {
      font-size: clamp(36px);
      letter-spacing: -0.07em;
      margin: 0 0 20px;
    }
    p {
      font-size: 20px;
      line-height: 1.5;
    }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>DesignCat</h1>
    <h2>Branding · Design · Web</h2>
    <p>New portfolio coming soon.</p>
  </main>
</body>
</html>
